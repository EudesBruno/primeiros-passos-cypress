name: CI

on: [push]
jobs:
    build-test:
        runs-on: ubuntu-latest
        steps:

            - name: Checkout
              uses: actions/checkout@v4

            - name: Node
              uses: actions/setup-node@v4
              with:
                node-version: 18
            
            - run: npm ci

            - name: Cypress Tests 
              uses: cypress-io/github-action@v5
              with:
                start: 'npm run dev'
                build: 'npm run build'

            - uses: actions/upload-artifact@v4
              if: always()
              with:
                name: Cypress Result
                path: |
                    cypress/screenshots
                    cypress/videos
                    cypress/results
                if-no-files-found: ignore